name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "1fd5ef03-cd40-4b77-b0d4-5dc05be429e1"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "451a7355612943cb8d5977e63ff7c9f0"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
